<style>
  :root{
    --ink:#2a2118;
    --ink-soft:#5a4f42;
    --paper:#f4ecd8;
    --paper-dim:#ece1c8;
    --wood:#2b2118;
    --wood-soft:#3c2f22;
    --brass:#b8934a;
    --brass-bright:#d4ac5e;
    --oxblood:#7a2e2e;
    --forest:#3f5142;
    --line:#d8c9a3;
    --radius:3px;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--wood);color:var(--paper);font-family:'Source Sans 3',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2,h3,.serif{font-family:'Fraunces',serif;}
  a{color:inherit;}

  header{
    background:linear-gradient(180deg,var(--wood-soft),var(--wood));
    padding:28px 20px 20px;
    border-bottom:3px solid var(--brass);
    position:sticky;top:0;z-index:20;
  }
  header .inner{max-width:960px;margin:0 auto;}
  header h1{margin:0 0 4px;font-size:1.9rem;font-weight:600;letter-spacing:.3px;color:var(--paper);}
  header p.tagline{margin:0 0 18px;color:var(--brass-bright);font-size:.85rem;}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;}
  .toolbar input[type="search"]{
    flex:1 1 200px;background:var(--paper);color:var(--ink);border:1px solid var(--line);
    border-radius:var(--radius);padding:9px 12px;font-size:.95rem;font-family:inherit;
  }
  select{
    background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:var(--radius);
    padding:9px 10px;font-size:.9rem;font-family:inherit;
  }
  button{font-family:inherit;cursor:pointer;}
  .btn-primary{
    background:var(--brass);color:var(--wood);border:none;border-radius:var(--radius);
    padding:10px 18px;font-weight:600;font-size:.95rem;
  }
  .btn-primary:hover{background:var(--brass-bright);}
  .btn-ghost{
    background:transparent;color:var(--brass-bright);border:1px solid var(--brass);
    border-radius:var(--radius);padding:9px 14px;font-size:.9rem;
  }
  .btn-ghost:hover{background:rgba(184,147,74,.12);}

  main{max-width:960px;margin:0 auto;padding:26px 20px 80px;}
  .sync-line{font-size:.78rem;color:var(--brass-bright);opacity:.8;margin-bottom:22px;display:flex;gap:8px;align-items:center;}
  .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--forest);display:inline-block;}
  .sync-dot.busy{background:var(--brass);}
  .sync-dot.error{background:var(--oxblood);}

  section.shelf{margin-bottom:34px;}
  section.shelf h2{
    font-size:1.05rem;font-weight:600;color:var(--brass-bright);margin:0 0 4px;
    padding-bottom:8px;border-bottom:1px solid rgba(184,147,74,.35);
  }
  .shelf-count{color:var(--ink-soft);font-family:'Source Sans 3',sans-serif;font-weight:400;font-size:.85rem;}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;margin-top:14px;}
  .card{
    background:var(--paper);color:var(--ink);border-radius:var(--radius);
    padding:14px 14px 12px 16px;position:relative;border-left:6px solid var(--forest);
    display:flex;flex-direction:column;gap:6px;
  }
  .card.read{opacity:.72;}
  .card-row{display:flex;gap:10px;}
  .cover-thumb{width:48px;height:70px;object-fit:cover;border-radius:2px;flex-shrink:0;background:var(--paper-dim);}
  .cover-placeholder{display:flex;align-items:center;justify-content:center;font-size:1.3rem;border:1px solid var(--line);}
  .card-body{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px;}
  .card .title{font-family:'Fraunces',serif;font-weight:600;font-size:1.05rem;line-height:1.25;}
  .card .author{font-size:.88rem;color:var(--ink-soft);}
  .card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px;}
  .tag{font-size:.72rem;padding:2px 8px;border-radius:12px;background:var(--paper-dim);color:var(--ink-soft);border:1px solid var(--line);}
  .card .row-actions{display:flex;gap:8px;margin-top:8px;align-items:center;}
  .mark-read{
    background:none;border:1px solid var(--forest);color:var(--forest);border-radius:var(--radius);
    padding:5px 10px;font-size:.78rem;font-weight:600;
  }
  .mark-read.done{border-color:var(--ink-soft);color:var(--ink-soft);}
  .icon-btn{background:none;border:none;color:var(--ink-soft);font-size:.85rem;padding:4px;}
  .icon-btn:hover{color:var(--oxblood);}
  .empty{color:var(--brass-bright);opacity:.75;font-size:.9rem;padding:20px 0;}

  .overlay{position:fixed;inset:0;background:rgba(15,11,7,.72);display:none;align-items:flex-start;justify-content:center;padding:30px 16px;overflow-y:auto;z-index:50;}
  .overlay.open{display:flex;}
  .modal{background:var(--paper);color:var(--ink);border-radius:6px;max-width:520px;width:100%;padding:24px;margin-top:20px;}
  .modal h3{margin:0 0 14px;font-size:1.25rem;}
  .modal label{display:block;font-size:.78rem;color:var(--ink-soft);margin:12px 0 4px;font-weight:600;}
  .modal input[type="text"], .modal select{
    width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:var(--radius);font-size:.92rem;font-family:inherit;background:#fff;
  }
  .search-row{display:flex;flex-wrap:wrap;gap:8px;}
  .search-row input{flex:1 1 140px;min-width:0;}
  .results{margin-top:10px;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--radius);}
  .result-item{padding:9px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:.85rem;}
  .result-item:last-child{border-bottom:none;}
  .result-item:hover{background:var(--paper-dim);}
  .result-item b{font-family:'Fraunces',serif;}
  .field-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}
  .field-grid .full{grid-column:1/-1;}
  .warning{background:#f4dede;border:1px solid var(--oxblood);color:var(--oxblood);padding:9px 11px;border-radius:var(--radius);font-size:.82rem;margin-top:12px;}
  .warning.ok{background:#e2ecdf;border-color:var(--forest);color:var(--forest);}
  .hint{font-size:.72rem;color:var(--ink-soft);margin-top:3px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;}
  .btn-link{background:none;border:none;color:var(--ink-soft);font-size:.85rem;text-decoration:underline;padding:6px;}
  .spinner{display:inline-block;width:13px;height:13px;border:2px solid var(--ink-soft);border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  @media(max-width:480px){.field-grid{grid-template-columns:1fr;}}
</style>
</head>

<header>

    </div>
  </div>
</header>

<main>
  <div class="sync-line"><span class="sync-dot" id="syncDot"></span><span id="syncText">Conectando con tu Sheet…</span><button class="btn-link" id="resyncBtn" style="padding:0 0 0 6px;">🔄 Releer del Sheet</button></div>
  <div id="shelves"></div>
</main>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3 id="modalTitle">Añadir libro</h3>

    <div id="searchStep">
      <label>Busca por título, autor o ISBN</label>
      <div class="search-row">
        <input type="text" id="bookQuery" placeholder="p. ej. Cien años de soledad">
        <button class="btn-primary" id="doSearch">Buscar</button>
        <button class="btn-ghost" id="scanBtn" title="Escanear código de barras">📷</button>
      </div>
      <div id="scanBox" style="display:none;margin-top:10px;">
        <video id="scanVideo" style="width:100%;border-radius:var(--radius);background:#000;" playsinline muted></video>
        <div class="modal-actions">
          <span class="hint" id="scanHint">Apunta a la parte trasera del libro, al código de barras.</span>
          <button class="btn-link" id="cancelScan">Cancelar escaneo</button>
        </div>
      </div>
      <div class="results" id="results" style="display:none;"></div>
      <div class="modal-actions">
        <button class="btn-link" id="skipSearch">Rellenar a mano en vez de buscar</button>
      </div>
    </div>

    <div id="formStep" style="display:none;">
      <div class="field-grid">
        <div class="full">
          <label>Título</label>

        </div>
        <div class="full">
          <label>Autor (Apellido, Nombre)</label>

const norm = s => (s||"").toString().toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").trim();
const $ = id => document.getElementById(id);
function setSync(text, busy, isError){
  $("syncText").textContent = text;
  $("syncText").style.color = isError ? "var(--oxblood)" : "";
  $("syncDot").className = "sync-dot" + (busy ? " busy" : "") + (isError ? " error" : "");
}

async function sheetGet(){
  const res = await fetch(SHEET_API_URL);
  return res.json();
}
async function sheetPost(payload){
  await fetch(SHEET_API_URL, {
    method:"POST",
    body: JSON.stringify(payload),
    headers:{"Content-Type":"text/plain;charset=utf-8"}
  });
}

let importError = null;
async function syncFromSheet(){
  try{
    setSync("Sincronizando con el Sheet…", true);
    const data = await sheetGet();
    const rows = data.books || [];
    if(!rows.length){
      importError = "El Sheet respondió pero sin libros — revisa que 'Libreria Luigia' sea el nombre correcto de la pestaña en Code.gs.";
      setSync(importError, false, true);
      return;
    }
    const batch = db.batch();
    rows.forEach(row=>{
      if(!row.rowIndex) return;
      const ref = booksCol.doc("row_"+row.rowIndex);
      batch.set(ref, {
        author: row.Author||"", title: row.Title||"", country: row.Country||"",
        language: row.Language||"", genre: row.Genre||"", subgenre: row["Sub-genre"]||"",
        prize: row.Prize||"", status: row.Status||"Physical",
        read: row.Read === true || row.Read === "TRUE",
        rowIndex: row.rowIndex, updatedAt: firebase.firestore.FieldValue.serverTimestamp()
      }, {merge:true});
    });
    await batch.commit();
    importError = null;
  }catch(err){
    console.error("Sync error", err);
    importError = "No se pudo sincronizar con el Sheet: " + (err.message||err);
    setSync(importError, false, true);
  }
}

function render(){
  const q = norm($("searchBox").value);

  const shelves = $("shelves");
  shelves.innerHTML = "";

  if(!q){
    shelves.innerHTML = `<div class="empty" style="padding:40px 0;text-align:center;">
      Escribe un autor o un título arriba para ver si ya lo tienes, y en qué estado está.
    </div>`;
    return;
  }

  const filtered = allBooks.filter(b=>
    norm(b.author).includes(q) || norm(b.title).includes(q)
  );

  if(filtered.length===0){
    shelves.innerHTML = `<div class="empty" style="padding:20px 0;">No tienes ningún libro que coincida — puede que aún no lo tengas.</div>`;
    return;
  }

  const groups = {Physical:"En la estantería (físico)", Digital:"En la estantería (digital)", Wishlist:"Lista de deseos"};
  Object.keys(groups).forEach(statusKey=>{
    const items = filtered.filter(b=>b.status===statusKey);
    if(items.length===0) return;
    const section = document.createElement("section");
    section.className = "shelf";
    section.innerHTML = `<h2>${groups[statusKey]} <span class="shelf-count">(${items.length})</span></h2>`;
    const grid = document.createElement("div");
    grid.className = "grid";
    items.sort((a,b)=> (a.author||"").localeCompare(b.author||""));
    items.forEach(b=> grid.appendChild(renderCard(b)));
    section.appendChild(grid);
    shelves.appendChild(section);
  });
}

function renderCard(b){
  const card = document.createElement("div");
  card.className = "card" + (b.read ? " read":"");
  const tags = [b.language, b.genre, b.subgenre, b.country].filter(Boolean)
    .map(t=>`<span class="tag">${t}</span>`).join("");
  const coverHtml = b.cover ? `<img class="cover-thumb" src="${b.cover}" alt="">` : `<div class="cover-thumb cover-placeholder">📖</div>`;
  card.innerHTML = `
    <div class="card-row">
      ${coverHtml}
      <div class="card-body">
        <div class="title">${b.title||"(sin título)"}</div>
        <div class="author">${b.author||"(autor desconocido)"}</div>
        <div class="tags">${tags}</div>
        <div class="row-actions">
          <button class="mark-read ${b.read?"done":""}" data-id="${b.id}">${b.read ? "Leído ✓" : "Marcar leído"}</button>
          <button class="icon-btn" data-edit="${b.id}" title="Editar">✏️</button>
          <button class="icon-btn" data-del="${b.id}" title="Eliminar">🗑</button>
        </div>
      </div>
    </div>
  `;
  card.querySelector(".mark-read").addEventListener("click", ()=>toggleRead(b));
  card.querySelector("[data-edit]").addEventListener("click", ()=>openEditModal(b));
  card.querySelector("[data-del]").addEventListener("click", ()=>deleteBook(b));
  return card;
}

async function toggleRead(b){
  const newRead = !b.read;
  await booksCol.doc(b.id).update({read:newRead});
  if(b.rowIndex){
    setSync("Actualizando el Sheet…", true);
    await sheetPost({action:"update", rowIndex:b.rowIndex, book: toSheetRow({...b, read:newRead})});
    setSync("Sincronizado con tu Sheet", false);
  }
}

async function deleteBook(b){
  if(!confirm(`¿Eliminar "${b.title}" de tu biblioteca?`)) return;
  await booksCol.doc(b.id).delete();
  if(b.rowIndex){
    setSync("Actualizando el Sheet…", true);
    await sheetPost({action:"delete", rowIndex:b.rowIndex});
    setSync("Sincronizado con tu Sheet", false);
  }
}

function toSheetRow(b){
  return {
    Author:b.author||"", Title:b.title||"", Country:b.country||"",
    Read: b.read ? "TRUE":"FALSE", Status:b.status||"Physical", Language:b.language||"",
    Genre:b.genre||"", "Sub-genre":b.subgenre||"", Prize:b.prize||""
  };
}

function checkDuplicate(author, title){
  const a = norm(author), t = norm(title);
  return allBooks.find(b => b.id!==editingId && norm(b.author)===a && norm(b.title)===t);
}

      }

      await sheetPost({action:"add", book: toSheetRow(book)});

async function searchBooks(query){
  const res = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=8&key=${GOOGLE_BOOKS_API_KEY}`);
  const data = await res.json();
  if(data.error){
    throw new Error(`Google Books: ${data.error.message||data.error.status||"error desconocido"}`);
  }
  return data.items || [];
}

function isbn13to10(isbn13){
  isbn13 = (isbn13||"").replace(/[^0-9]/g,"");
  if(isbn13.length !== 13 || !isbn13.startsWith("978")) return null;
  const core = isbn13.substring(3,12);
  let sum = 0;
  for(let i=0;i<9;i++){ sum += (10-i) * parseInt(core[i],10); }
  const check = (11 - (sum % 11)) % 11;
  return core + (check === 10 ? "X" : String(check));
}

async function lookupOpenLibrary(isbn){
  const res = await fetch(`https://openlibrary.org/api/books?bibkeys=ISBN:${isbn}&format=json&jscmd=data`);
  const text = await res.text();
  if(!text || !text.trim()) return null; // Open Library returns an empty body when nothing matches
  let data;
  try{ data = JSON.parse(text); }catch(e){ return null; }
  const book = data[`ISBN:${isbn}`];
  if(!book) return null;
  return { volumeInfo: {
    title: book.title || "",
    authors: (book.authors||[]).map(a=>a.name),
    categories: (book.subjects||[]).map(s=>s.name),
    language: ""
  }};
}

/* Try the exact ISBN, then its ISBN-10 form, then Open Library — keep a log of what happened at each step */
async function searchByIsbnChain(isbn){
  const log = [];
  try{
    const items = await searchBooks(`isbn:${isbn}`);
    log.push(`Google Books (${isbn}): ${items.length} resultado(s)`);
    if(items.length) return {items, log};
  }catch(err){ log.push(`Google Books (${isbn}) falló: ${err.message||err}`); }

  const isbn10 = isbn13to10(isbn);
  if(isbn10){
    try{
      const items = await searchBooks(`isbn:${isbn10}`);
      log.push(`Google Books (${isbn10}): ${items.length} resultado(s)`);
      if(items.length) return {items, log};
    }catch(err){ log.push(`Google Books (${isbn10}) falló: ${err.message||err}`); }
  }

  try{
    const ol = await lookupOpenLibrary(isbn);
    log.push(`Open Library: ${ol ? "encontrado" : "sin resultado"}`);
    if(ol) return {items:[ol], log};
  }catch(err){
    log.push(`Open Library falló: ${err.message||err}`);
  }

  try{
    const items = await searchBooks(isbn);
    log.push(`Google Books (texto plano "${isbn}"): ${items.length} resultado(s)`);
    return {items, log};
  }catch(err){
    log.push(`Google Books (texto plano) falló: ${err.message||err}`);
    return {items:[], log};
  }
}

function formatAuthor(name){
  if(!name) return "";
  const parts = name.trim().split(/\s+/);
  if(parts.length < 2) return name;
  const last = parts.pop();
  return `${last}, ${parts.join(" ")}`;
}

function guessGenreSubgenre(categories){
  const cats = (categories||[]).join(" / ");
  const catsNorm = norm(cats);
  let subgenre = "";
  for(const s of KNOWN_SUBGENRES){
    if(catsNorm.includes(norm(s))){ subgenre = s; break; }
  }
  let genre = "";
  if(catsNorm.includes("fiction")) genre = "Fiction";
  else if(cats) genre = "Non-fiction";
  return {genre, subgenre};
}

async function lookupCountry(authorName){
  if(!authorName) return "";
  try{
    const searchRes = await fetch(`https://www.wikidata.org/w/api.php?action=wbsearchentities&search=${encodeURIComponent(authorName)}&language=en&format=json&origin=*&type=item&limit=1`);
    const searchData = await searchRes.json();
    const id = searchData.search && searchData.search[0] && searchData.search[0].id;
    if(!id) return "";
    const claimsRes = await fetch(`https://www.wikidata.org/w/api.php?action=wbgetclaims&entity=${id}&property=P27&format=json&origin=*`);
    const claimsData = await claimsRes.json();
    const claims = claimsData.claims && claimsData.claims.P27;
    if(!claims || !claims.length) return "";
    const countryId = claims[0].mainsnak.datavalue.value.id;
    const labelRes = await fetch(`https://www.wikidata.org/w/api.php?action=wbgetentities&ids=${countryId}&props=labels&languages=es|en&format=json&origin=*`);
    const labelData = await labelRes.json();
    const labels = labelData.entities[countryId].labels;
    return (labels.es && labels.es.value) || (labels.en && labels.en.value) || "";
  }catch(err){
    console.error("Wikidata lookup failed", err);
    return "";
  }
}

let pendingCover = "";
async function fillFormFromResult(item){
  const info = item.volumeInfo || {};
  const rawAuthor = (info.authors||[])[0] || "";
  $("f_title").value = info.title || "";
  $("f_author").value = formatAuthor(rawAuthor);
  $("f_language").value = LANG_MAP[info.language] || info.language || "";
  const {genre, subgenre} = guessGenreSubgenre(info.categories);
  $("f_genre").value = genre;
  $("f_subgenre").value = subgenre;
  $("f_country").value = "";
  $("countryHint").textContent = "Buscando país del autor…";
  pendingCover = (info.imageLinks && info.imageLinks.thumbnail) ? info.imageLinks.thumbnail.replace(/^http:/,"https:") : "";
  goToForm();
  checkAndWarnDuplicate();
  const country = await lookupCountry(rawAuthor);
  $("f_country").value = country;
  $("countryHint").textContent = country ? "" : "No se encontró con certeza — revísalo a mano.";
}

function checkAndWarnDuplicate(){
  const box = $("dupWarning");
  if(!$("f_title").value.trim()){ box.style.display = "none"; return; }
  const dup = checkDuplicate($("f_author").value, $("f_title").value);
  box.style.display = "block";
  if(dup){
    box.classList.remove("ok");
    box.textContent = `Ya tienes esta obra (${dup.language||"idioma no indicado"}, ${dup.status}). Puedes seguir si quieres otra edición.`;
  }else{
    box.classList.add("ok");
    box.textContent = `No la tienes todavía en tu biblioteca.`;
  }
}

async function runSearch(q){
  if(!q) return;
  $("doSearch").innerHTML = `<span class="spinner"></span>`;
  const box = $("results");
  box.style.display = "block";
  const bareDigits = q.replace(/^isbn:/i,"").replace(/[^0-9Xx]/g,"");
  const looksLikeIsbn = /^isbn:/i.test(q) || /^(?:\d{13}|\d{9}[\dXx])$/.test(bareDigits);
  let items = [];
  let isbnLog = null;
  try{
    if(looksLikeIsbn){
      const result = await searchByIsbnChain(bareDigits);
      items = result.items;
      isbnLog = result.log;
    }else{
      items = await searchBooks(q);
    }
  }catch(err){
    console.error("Search failed", err);
    $("doSearch").textContent = "Buscar";
    box.innerHTML = `<div class="result-item">Fallo al buscar: ${err.message||err} — prueba de nuevo en un momento, o "Rellenar a mano".</div>`;
    return;
  }
  $("doSearch").textContent = "Buscar";
  const notFoundMsg = looksLikeIsbn
    ? `No lo encuentro. Detalle:<br>${isbnLog.join("<br>")}<br>Prueba a buscar por título/autor, o "Rellenar a mano".`
    : `Sin resultados para esa búsqueda — prueba con otras palabras, o "Rellenar a mano".`;
  box.innerHTML = items.length ? "" : `<div class="result-item">${notFoundMsg}</div>`;
  items.forEach(item=>{
    const info = item.volumeInfo||{};
    const div = document.createElement("div");
    div.className = "result-item";
    div.innerHTML = `<b>${info.title||"(sin título)"}</b><br>${(info.authors||[]).join(", ")||"Autor desconocido"}`;
    div.addEventListener("click", ()=>fillFormFromResult(item));
    box.appendChild(div);
  });
}
$("doSearch").addEventListener("click", ()=> runSearch($("bookQuery").value.trim()));

/* ---- Barcode scanning (ISBN) ---- */
let scanner = null;
function stopScan(){
  if(scanner){ try{ scanner.reset(); }catch(e){} }
  $("scanBox").style.display = "none";
}
async function startScan(){
  $("scanBox").style.display = "block";
  $("scanHint").textContent = "Apunta a la parte trasera del libro, al código de barras.";
  try{
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.EAN_13, ZXing.BarcodeFormat.EAN_8]);
    scanner = new ZXing.BrowserMultiFormatReader(hints);
    await scanner.decodeFromConstraints(
      { video: { facingMode: "environment" } },
      "scanVideo",
      (result, err) => {
        if(result){
          const isbn = result.getText();
          if(!/^97[89]\d{10}$/.test(isbn)){
            $("scanHint").textContent = `Código detectado (${isbn}) no parece un ISBN de libro — sigo escaneando, ajusta el encuadre al código grande.`;
            return; // keep scanning, don't accept a non-book barcode
          }
          stopScan();
          $("bookQuery").value = isbn;
          runSearch(`isbn:${isbn}`);
        }
        // errors fire on every frame with no barcode found — ignore those, they're not real failures
      }
    );
  }catch(err){
    console.error("Scan error", err);
    $("scanHint").textContent = "No se pudo acceder a la cámara. Revisa los permisos de Safari para esta app.";
  }
}
$("scanBtn").addEventListener("click", startScan);
$("cancelScan").addEventListener("click", stopScan);
